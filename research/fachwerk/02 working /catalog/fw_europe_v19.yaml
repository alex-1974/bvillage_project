- chid: "FW:DE:BB:havel:baeckerstrasse-14-brandenburg-havel"
  title: "Fachwerkhaus Bäckerstraße 14 (Ständerbau)"
  locality: "Brandenburg an der Havel, Altstadt, Bäckerstraße 14"
  admin: "BB"
  country: "DE"
  date: "1408"
  date_method: "dendro"
  type: "buergerhaus_fachwerk"
  ev: "E1"
  provenance: "in_situ"
  source: >
    Europäische Route der Backsteingotik (eurob.org, Brandenburg an der Havel):
    „Haus Bäckerstraße 14, einem gotischen Ständerbau von 1408, dem bislang
    ältesten Fachwerkhaus des Bundeslandes [Brandenburg]."
    Müller, Joachim: „Der Fachwerkbau des 12. bis 17. Jahrhunderts in der
    Stadt Brandenburg an der Havel", Mitt. DGAMN / Jahrbuch für Hausforschung
    (Heidelberg, journals.ub.uni-heidelberg.de): gotischer Ständerbau,
    regelmäßige Wandständer (Abstand 1,6–1,7 m), durchgesteckte Decken-
    balken mit Zapfenschloss, Sparrendreieck über dem Ständer, angeblattete
    Kopfbänder. Straßenseitige Breite ca. 10 m, Tiefe ca. 9 m.
  notes: >
    Ältestes Fachwerkhaus des Bundeslandes Brandenburg (laut Backsteingotik-
    Route). Gotischer Ständerbau — Dachbalken durch Ständer gesteckt
    (archaischer als zeitgenössische Konstruktionen mit Überkämmung auf den
    Rähm). Datierung (d) = Dendrodatum. In-situ in der Altstadt. Konstruktions-
    typ: spätgotischer Ständerbau, typisch für nordostdeutschen Stadtfachwerk
    des frühen 15. Jahrhunderts. Primärquelle Müller-Aufsatz für Konstruktions-
    details, Sekundärquelle Backsteingotik-Route für Superlativ-Aussage.

- chid: "FW:DE:BB:havel:altstaedt-fischerstr-11-12-brandenburg-havel"
  title: "Fachwerkhaus Altstädtische Fischerstraße 11/12"
  locality: "Brandenburg an der Havel, Altstadt, Altstädtische Fischerstraße 11/12"
  admin: "BB"
  country: "DE"
  date: "1440"
  date_method: "dendro"
  type: "buergerhaus_fachwerk"
  ev: "E2"
  provenance: "in_situ"
  source: >
    Müller, Joachim: „Der Fachwerkbau des 12. bis 17. Jahrhunderts in der
    Stadt Brandenburg an der Havel", Mitt. DGAMN / Jahrbuch für Hausforschung
    (Heidelberg): „Das Fachwerkhaus Altstädtische Fischerstraße 11/12 ...
    stammt ... mit seinem in wesentlichen Teilen erhaltenen Fachwerkgerüst
    aus dem Jahre 1440 (d). Es ist mit ca. 11 m straßenseitiger Breite und
    knapp 10 m Tiefe etwas größer als das Haus in der Bäckerstraße ...
    Auch hier findet man eine regelmäßige Folge von Wandständern (Abstand
    1,6 bis 1,7 m), durchgesteckte Deckenbalken mit Zapfenschloss, Sparren-
    dreieck jeweils über dem Ständer und angeblattete Kopfbänder."
  notes: >
    EV E2 — im 18. Jh. in zwei separate Einheiten geteilt, seither mehrfach
    verändert. Fachwerkgerüst in wesentlichen Teilen erhalten. Konstruktions-
    fortschritt gegenüber Bäckerstraße 14: Dachbalken nicht durch Ständer
    gesteckt, sondern mit Überkämmung auf den Rähm gelegt. Gleiche Grund-
    grammatik (Ständerbau, Kopfbänder, Sparrendreieck über dem Ständer).
    Dendrodatum (d).

