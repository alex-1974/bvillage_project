# --- GÖTTINGEN ERGÄNZUNG ---

- chid: "FW:DE:NI:goettingen:rote-strasse-25"
  title: "Haus Rote Straße 25"
  locality: "Göttingen, Rote Straße 25"
  admin: "NI"
  country: "DE"
  date: "1276"
  date_method: "dendro"
  type: "buergerhaus_gotisch"
  ev: "E2"
  provenance: "in_situ"
  source: >
    Kudaba – Kulturdatenbank: „Das Haus Rote Straße 25 in Göttingen
    gehört mit dem Errichtungsjahr 1276 zu den ältesten noch erhaltenen
    Fachwerkhäusern in Deutschland. Die exakte Datierung erfolgt aufgrund
    von dendrochronologischen Untersuchungen." Monumente Online (2007):
    „Eine gewisse Sensation bedeutete die Datierung des Fachwerkhauses
    Rote Strasse 25 in Göttingen in das Jahr 1276, nicht allein wegen des
    nochmals höheren Alters, sondern weil es schon damals traufenständig
    erbaut worden ist. Damit scheint diese für das Mittelalter besondere
    Bauweise im Harzraum und Leinetal von Anfang an üblich gewesen zu sein."
    Landkreis Göttingen Tourismus: „Typisches gotisches Wohnhaus (1276),
    ältestes Fachwerkhaus der Stadt."
  notes: >
    Ältestes dendrodatiertes Fachwerkhaus Göttingens und eines der ältesten
    Deutschlands überhaupt. Dendrodatierung 1276 (Dachbalken mit Waldkante,
    Labor nicht in Sekundärquellen genannt — Primärquelle ausstehend).
    Traufständige Ausrichtung von Anfang an — für das Mittelalter in
    Norddeutschland ungewöhnlich. Die Traufständigkeit im Leinetal und
    Harzraum scheint eine regional frühe Norm zu sein, während im übrigen
    Deutschland Giebelstellung dominierte. Knaggen als konstruktives
    Schmuckelement erhalten. Vorkragendes zweites Obergeschoss.
    Ersetzt den Eintrag FW:DE:NI:goettingen:holbornsches-haus als
    ältestes Göttinger Objekt — Holbornsches Haus bleibt wegen romanischem
    Gewölbekeller eigenständig (Steinbausubstanz, nicht reines Fachwerk).
    needs_verification: false (Dendrodatierung in mehreren unabhängigen
    Sekundärquellen übereinstimmend bestätigt).

# --- HAMELN EINTRÄGE ---

- chid: "FW:DE:NI:hameln:stiftsherrenhaus"
  title: "Stiftsherrenhaus (Poppendiek-Haus)"
  locality: "Hameln, Osterstraße 8"
  admin: "NI"
  country: "DE"
  date: "1558"
  date_method: "urkundlich"
  type: "patrizierhaus_weserrenaissance"
  ev: "E1"
  provenance: "in_situ"
  source: >
    Museum Hameln (museumhameln.de): „Der Hamelner Bürgermeister Friedrich
    Poppendiek ließ das Stiftsherrenhaus 1558 als Neubau mit drei
    Vollgeschossen und einem Grundriß von 15 x 15m traufenständig zur
    Osterstraße errichten. Die Deckenbalken haben ohne Stoß Längen von
    mehr als 15 Metern." Architektur-Bildarchiv: „Das Stiftsherrenhaus
    in der Hamelner Altstadt wurde 1558 für den Bürgermeister Friedrich
    Poppendiek als Fachwerkhaus im Stil der Weserrenaissance erbaut."
    Weserbergland Tourismus: „Das Stiftsherrenhaus wurde 1558 erbaut."
  notes: >
    Eines der größten Fachwerkhäuser des 16. Jahrhunderts in Nordwest-
    deutschland. Grundriss 15 x 15 m, drei Vollgeschosse, traufständig.
    Deckenbalken über 15 m ohne Stoß — technisch außergewöhnlich (Normal-
    maß selbst bei großen Häusern unter 13 m). Bauherr Friedrich Poppendiek:
    Bürgermeister und Kaufmann. Parzellenzusammenlegung 1558 oder früher
    wahrscheinlich (Haus breiter als benachbarte Parzellen). Beide Speicher-
    geschosse nachträglich im 18./19. Jh. zu Wohnzwecken unterteilt.
    Schnitzprogramm: biblische Motive und antike Planetengötter.
    Heute Museum Hameln (zusammen mit Leisthaus). Weserrenaissance-Cluster
    Hameln: Stiftsherrenhaus (1558), Rattenkrug/Bäckerstraße 16 (1568,
    Cord Tönnies), Leisthaus (1585–89), Rattenfängerhaus (1602/03),
    Hochzeitshaus (1610–17) — längster dokumentierter Bauboom der Region.

- chid: "FW:DE:NI:hameln:leisthaus"
  title: "Leisthaus"
  locality: "Hameln, Osterstraße 9"
  admin: "NI"
  country: "DE"
  date: "1585"
  date_method: "urkundlich"
  date_range: "1585-1589"
  type: "kaufmannshaus_weserrenaissance"
  ev: "E1"
  provenance: "in_situ"
  source: >
    Architektur-Bildarchiv: „Das Leisthaus wurde 1585-89 nach Plänen von
    Cord Tönnis für den Kaufmann Gerd Leist im Stil der Weserrenaissance
    erbaut." Reisefrequenzen: „Der Kern des Hauses ist gotisch, zur
    zeitgemäßen Umgestaltung beauftragte der Investor Gerd Leist 1585
    Cord Tönnies als Architekten."
  notes: >
    Kaufmann Gerd Leist, Auftraggeber. Architekt Cord Tönnies — zentraler
    Leitfigur der Weserrenaissance; baute auch Schloss Schwöbber, Schloss
    Leitzkau, arbeitete in Lemgo und Detmold. Kern des Hauses gotisch
    (14./15. Jh.?), Sandsteinfassade Weserrenaissance 1585–89. Sechs
    Kardinaltugenden am Brüstungsfries — humanistisches Bildprogramm.
    Museum Hameln seit Ende 20. Jh. (zusammen mit Stiftsherrenhaus).
    Cord Tönnies als Netzwerkknoten: sein Wirken verbindet Hameln mit
    Detmold, Lemgo, Minden — möglicher Dendro-Netz-Nachweis für
    Werkstattwanderung entlang der Weser.

