# --- HILDESHEIM EINTRÄGE ---

- chid: "FW:DE:NI:hildesheim:waffenschmiedehaus"
  title: "Waffenschmiedehaus"
  locality: "Hildesheim, Gelber Stern 21"
  admin: "NI"
  country: "DE"
  date: "1548"
  date_method: "inschrift"
  type: "handwerkerhaus_fruehrenaissance"
  ev: "E1"
  provenance: "in_situ"
  source: >
    Wikipedia Waffenschmiedehaus: „Das Waffenschmiedehaus wurde 1548
    erbaut, wie die Jahreszahl über dem gotisch anmutenden Eingang anzeigt,
    und ist damit eines der ältesten noch erhaltenen Wohnhäuser Hildesheims."
    Hildesheim Tourismus: „Das Waffenschmiedehaus aus dem Jahr 1548 ist
    das älteste erhaltene Fachwerkhaus Hildesheims. Über der Tür ließ der
    hier früher ansässige Schmied ein Schnitzwerk aus Radschloss,
    Kettenkugeln und Jahreszahl anbringen."
  notes: >
    Ältestes erhaltenes Fachwerkhaus Hildesheims. Datierung 1548 durch
    Inschrift über dem Eingang (gotisch anmutend — Übergangsform in Stil
    und Konstruktion). Handwerker-Bauherr: Waffenschmied. Schnitzwerk
    über Eingang thematisiert das Handwerk direkt (Radschloss, Kettenkugeln)
    — ungewöhnliche ikonographische Direktheit. Frührenaissance-Fachwerk;
    Renovierung Anfang 19. Jh. (Fachwerk und Grundschwelle erneuert,
    Erdgeschoss umgestaltet — konstruktiver Kern aber original). WWII
    ohne nennenswerte Schäden überstanden. Hildesheim verlor durch
    Bombenangriff März 1945 fast den gesamten Marktplatz mit Knochenhauer-
    amtshaus (1529) und Bäckeramtshaus — beide 1986–89 rekonstruiert.
    Vergleich mit Stiftsherrenhaus Hameln (1558): zeitgleiche Handwerker-
    und Patrizierarchitektur im selben Jahrzehnt, aber grundverschiedene
    soziale Ebene des Bauherrn.

# --- LEMGO EINTRAG ---

- chid: "FW:DE:NRW:lemgo:hexenbuergermeisterhaus"
  title: "Hexenbürgermeisterhaus (Kruwel-Haus)"
  locality: "Lemgo, Breite Straße 19"
  admin: "NRW"
  country: "DE"
  date: "1568"
  date_method: "urkundlich"
  date_range: "1568-1571"
  type: "kaufmannshaus_weserrenaissance"
  ev: "E1"
  provenance: "in_situ"
  source: >
    Gesichter der Weserrenaissance (gesichter-weserrenaissance.de):
    „Eines der bedeutendsten Bürgerhäuser in Nordwestdeutschland ist das
    sogenannte Hexenbürgermeisterhaus, das 1568–71 für Hermann Kruwel und
    seine Gemahlin Lisbeth Fürstenau gebaut wurde." Bauherreninschrift
    am Haus: „In Gottes Namen und unter dem Schutz Christi hat Hermann
    Kruwell dieses Haus an dieser Stätte erbaut im Jahr 1571."
    Bauhandwerk-Magazin: Fassadenrestaurierung 2013–2016 dokumentiert
    — Weserrenaissance-Ostfassade mit Buntsandsteinzierwerk.
  notes: >
    Bauherr Hermann Kruwel, Kaufmann, 1572–82 Bürgermeister. Inschrift-
    datum 1571 (Fertigstellung), Baubeginn 1568. Name des Hauses stammt
    von späterem Bewohner Hermann Cothmann (Bürgermeister 1662–82),
    der für ~90 Hinrichtungen wegen Hexerei verantwortlich war —
    kein Zusammenhang mit der Baugeschichte. Besonderheit: dem Fachwerk-
    bau wurde eine Steinfassade aus Buntsandstein vorgeblendet — eine
    überaus aufwändige Form für einen Kaufmann (typischer für Palaststil
    kleiner Residenzen). Architekt: dem Lemgoer Baumeister Hermann Wulff
    zugeschrieben (abweichend von Cord Tönnies — Lemgo hatte eigene
    Meisterwerkstatt, kein Tönnies-Monopol). Adam-und-Eva-Portal und
    Tugendfiguren an Erkern — vollständiges humanistisches Bildprogramm.
    Städtisches Museum seit 1926 — eines der ältesten Stadtmuseen OWL.
    Lemgo als Hansestadt: eigenständige Baukultur mit lokalen Meistern,
    parallel zu Hamelns Cord-Tönnies-Netz, nicht abhängig davon.

