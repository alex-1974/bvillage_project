    baute 1564–1571 dieses zweifellos bekannteste höxteraner Wohnhaus im
    Stil der Weserrenaissance um." Historisches Vereinsblatt HVV: „Es
    steht in den gegenwärtigen Ausmaßen seit dem Jahre 1561." Fachwerk-
    App Höxter: Alte Dechanei 1561.
  notes: >
    Datierungskonflikt: Historisch erhaltene Ausmaße seit 1561 (HVV),
    Umbau zur Weserrenaissance durch Christoph von Amelunxen 1564–1571
