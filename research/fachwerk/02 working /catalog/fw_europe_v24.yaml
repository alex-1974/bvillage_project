    bis ins Hochmittelalter zurückreichend. Bauherr von Amelunxen erwarb
    Reichtum als Rittmeister im Dienste Frankreichs — ungewöhnliche
    Provenance. Über 60 unterschiedlich gestaltete Fächerrosetten an der
    zwiegiebeligen Front. Polygonale, zweigeschossige Utlucht — aufwändigste
    Erkerform der Weserrenaissance. Seit 1796 Pfarrhaus der katholischen
