  provenance: "transloziert"
  source: >
    LWL-Freilichtmuseum Detmold (Besuchsbericht zeilenabstand.net):
    „Letzterer stammt vom Hof Wilper in Winkhausen, ist für das Jahr
    1561d dendrodatiert und zeigt wiederum Fächerrosetten – ein
    bemerkenswerter Luxus an einem Nebengebäude."
  notes: >
    Dendrodatiert 1561 (d = exaktes Fälljahr). Nebengebäude eines
    westfälischen Bauernhofs — Speicher, kein Haupthaus. Fächerrosetten
    als Schmuckelement an einem Wirtschaftsgebäude: erhöhter Aufwand,
    der auf wohlhabenden Hof oder regionale Schreinerkultur hinweist.
    Vergleich: Valepagenhof Haupthaus (1577d, Delbrück) im gleichen
    Freilichtmuseum — figuraler Fassadenschmuck, niederer Adel als Bauherr.
    Beide Dendrodatierungen aus LWL-Dendrochemie-Archiv.
    Lippischer Meierhof Haupthaus (1570, Leese) im selben Museum als
    weiteres Vergleichsobjekt derselben Dekade.
