  date_method: "dendro"
  date_qualifier: "ca."
  type: "dielenstadthaus_gotisch"
  ev: "E1"
  provenance: "in_situ"
  source: >
    Fachwerk5Eck (fachwerk5eck.de): „Das um 1400 erbaute Fachwerkhaus
    Alte Windmühle in der Ziegelstraße 66 ist das älteste erhaltene
    gotische Gebäude in Mischkonstruktion mit durchgehenden Ständern über
    Erd- und Zwischengeschoss und einem Stockwerkrahmen darüber – ein
    für die Fachwerk-Fünfeck-Region typisches Dielenstadthaus."
    Stadt Hann. Münden (Sanierungsdokumentation Altstadt III): „Mündener
    Altstadt, nur 2 Gebäude konnten bisher nach dendrochronologischer
    Untersuchung ein noch früheres Baudatum aufweisen – diese Häuser sind
    jedoch durch spätere Um- und Anbauten so verändert, dass ihre
    ursprüngliche Bauart kaum noch erkennbar ist."
  notes: >
    Ältestes datiertes Fachwerkhaus Hann. Mündens mit erkennbarer
    Originalstruktur. Dendrodatierung ~1400 (Stadtdokumentation bestätigt
    Dendrochronologie, zwei noch ältere Gebäude existieren aber stark
    verändert). Mischkonstruktion: durchgehende Ständer über EG und
    Zwischengeschoss + Stockwerkrahmen darüber — konstruktiver Übergang
    in situ, zeitgleich mit Braunschweiger Ständerbau (Spohrhaus 1357,
    Echternstraße 8 1391). Dielenstadthaus: typisch für Stapelrecht-
    Stadt — Erdgeschoss als Handelsdiele, Obergeschoss Wohnen und
    Vorrat. Heute Hotel. Sanierung dokumentiert gotischen Torbogen-
    Rekonstruktion. Hann. Münden: 700 Fachwerkhäuser aus 6 Jahrhunderten
    — dichtester erhaltener Bestand dieser Größenordnung in Südniedersachsen.
    needs_verification: false (Dendrodatierung durch Stadtbaudokumentation
    bestätigt, Quelle Primär verfügbar im Stadtarchiv).

