[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bvillage-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
# We use a simple flat layout: package is directly under the project root.
packages = ["bvillage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
